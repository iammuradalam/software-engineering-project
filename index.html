<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lasers and Feelings</title>
</head>
<body>
    <h1>Lasers and Feelings</h1>

    <p>Software support for players and the GM.</p>

    <h2>Player Character</h2>

    <label for="characterName">Character name:</label>
    <input type="text" id="characterName">

    <button onclick="saveName()">Save Name</button>

    <p id="nameMessage"></p>

    <br>

    <label for="playerNumber">Character number:</label>
    <input type="number" id="playerNumber" min="2" max="5">

    <button onclick="saveNumber()">Save Number</button>

    <p id="numberMessage"></p>

    <br>

    <label for="characterStyle">Style:</label>
    <select id="characterStyle">
        <option value="">Choose style</option>
        <option value="Alien">Alien</option>
        <option value="Android">Android</option>
        <option value="Dangerous">Dangerous</option>
        <option value="Hot-shot">Hot-shot</option>
        <option value="Intrepid">Intrepid</option>
        <option value="Sexy">Sexy</option>
    </select>

    <br><br>

    <label for="characterRole">Role:</label>
    <select id="characterRole">
        <option value="">Choose role</option>
        <option value="Doctor">Doctor</option>
        <option value="Engineer">Engineer</option>
        <option value="Explorer">Explorer</option>
        <option value="Pilot">Pilot</option>
        <option value="Scientist">Scientist</option>
        <option value="Soldier">Soldier</option>
    </select>

    <button onclick="saveStyleRole()">Save Style and Role</button>

    <p id="styleRoleMessage"></p>

    <h2>Game Tools</h2>

    <button onclick="throwDice()">Throw Dice</button>

    <p id="result">Result will appear here.</p>

    <script>
        function saveName() {
            let name = document.getElementById("characterName").value.trim();

            if (name !== "") {
                document.getElementById("nameMessage").textContent =
                    "Character name saved: " + name;
            } else {
                document.getElementById("nameMessage").textContent =
                    "Please enter a character name.";
            }
        }

        function saveNumber() {
            let number = document.getElementById("playerNumber").value;

            if (number >= 2 && number <= 5) {
                document.getElementById("numberMessage").textContent =
                    "Character number saved: " + number;
            } else {
                document.getElementById("numberMessage").textContent =
                    "Please choose a number between 2 and 5.";
            }
        }

        function saveStyleRole() {
            let style = document.getElementById("characterStyle").value;
            let role = document.getElementById("characterRole").value;

            if (style !== "" && role !== "") {
                document.getElementById("styleRoleMessage").textContent =
                    "Style saved: " + style + " | Role saved: " + role;
            } else {
                document.getElementById("styleRoleMessage").textContent =
                    "Please choose both a style and a role.";
            }
        }

        function throwDice() {
            let result = Math.floor(Math.random() * 6) + 1;

            document.getElementById("result").textContent =
                "Dice result: " + result;
        }
    </script>
</body>
</html>
